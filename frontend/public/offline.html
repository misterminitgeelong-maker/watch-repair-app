<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1410" />
    <title>Mainspring — Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ms-bg: #F5F1EC;
        --ms-surface: #FDFCF9;
        --ms-text: #1A1410;
        --ms-text-mid: #5C4B3C;
        --ms-border: #E2D9CE;
        --ms-accent: #9A6E26;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ms-bg: #17100C;
          --ms-surface: #241A14;
          --ms-text: #F6F1EA;
          --ms-text-mid: #C6B6A4;
          --ms-border: #3A2C22;
          --ms-accent: #C9A248;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Clear the notch/home indicator on phones. */
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: var(--ms-bg);
        color: var(--ms-text);
      }
      .card {
        max-width: 28rem;
        width: 100%;
        padding: 2rem;
        background: var(--ms-surface);
        border: 1px solid var(--ms-border);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(31, 23, 18, 0.06);
        text-align: center;
      }
      h1 {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 0.75rem;
        color: var(--ms-text);
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--ms-text-mid);
      }
      .accent {
        display: inline-block;
        margin-top: 1.25rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ms-accent);
        letter-spacing: 0.02em;
      }
      .retry {
        /* 44px minimum touch target. */
        min-height: 44px;
        margin-top: 1.25rem;
        width: 100%;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: var(--ms-accent);
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <img class="logo" src="/icon-192.png" alt="" width="56" height="56" />
      <h1>You&rsquo;re offline</h1>
      <p>Mainspring can&rsquo;t reach the network right now. Check your connection, then try again. Screens you have already opened may still work, and any intake you were typing is kept as a draft on this device.</p>
      <button class="retry" type="button" onclick="window.location.reload()">Try again</button>
      <p class="accent">Mainspring</p>
    </div>
  </body>
</html>
