<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG favicon — modern browsers (Chrome, Firefox, Edge) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- PNG fallback for older browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Matches manifest theme_color/background_color so the installed app,
         splash screen and browser chrome agree. -->
    <meta name="theme-color" content="#1E1410" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- cache-bust: minit-hq-sidebar-v3 -->
    <meta name="app-build" content="dev" />
    <meta name="description" content="Mainspring — job tickets, quotes, invoices and customer texts for watch, shoe and mobile key repair businesses." />
    <meta property="og:title" content="Mainspring" />
    <meta property="og:description" content="Job tickets, quotes, invoices and customer texts for watch, shoe and mobile key repair businesses." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mainspring.au/" />
    <meta property="og:image" content="https://mainspring.au/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Standard name first; the apple- prefixed one stays for older iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mainspring" />
    <!-- iOS home screen icon (180x180 square spring icon) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <title>Mainspring — job tickets, quotes and invoices for repair trades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Three faces, one request: Plus Jakarta Sans (body/forms/tables),
         Archivo (headings, uppercase micro-labels, stat numbers),
         Instrument Serif (display: page titles + wordmark, regular only). -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..800&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
