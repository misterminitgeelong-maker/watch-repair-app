plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Push notifications need app/google-services.json (never committed). Without it the app still builds and runs, just without push.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProperties.load(it) }
}
def mapsKey = (localProperties.getProperty('maps.api.key') ?: '').trim()

// Release signing: the Play upload key lives OUTSIDE the repo (the same file the Capacitor app uses). Without it the release build is simply unsigned.
def keystoreProps = new Properties()
def keystoreFile = file("${System.getProperty('user.home')}/.mainspring-signing/keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
// Same scheme as the Capacitor weekly release (minutes since the epoch), so every upload is higher than the last one Play has seen.
def releaseVersionCode = (project.findProperty('versionCode') ?: ((long) (System.currentTimeMillis() / 60000L)).toString()).toInteger()
def releaseVersionName = (project.findProperty('versionName') ?: new Date().format('yyyy.MM.dd', TimeZone.getTimeZone('UTC'))) as String

def apiBaseUrl = (localProperties.getProperty('api.base.url') ?: 'https://mainspring.au/').trim()
if (!apiBaseUrl.endsWith('/')) {
    apiBaseUrl += '/'
}

android {
    namespace 'au.mainspring.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'au.mainspring.nativeapp'
        manifestPlaceholders = [mapsApiKey: mapsKey]
        buildConfigField 'boolean', 'MAPS_CONFIGURED', mapsKey.isEmpty() ? 'false' : 'true'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl.replace('"', '\\"')}\""
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            // A store build always talks to the live site; a developer's local.properties override (emulator or test server) must never leak into it.
            buildConfigField 'String', 'API_BASE_URL', "\"https://mainspring.au/\""
            // Shrinking stays off: the app reads JSON with reflection (Gson) and the debug test suite cannot exercise an R8 build, so it is not safe to turn on blind.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

// The release build replaces the existing Play app (au.mainspring.app, signed with the same upload key); debug and test builds keep their own IDs.
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.applicationId.set('au.mainspring.app')
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.biometric:biometric:1.1.0'
    // biometric 1.1.0 pulls an old fragment library that breaks the permission result API used by Compose screens
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
