<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://tile.openstreetmap.org data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Route map</title><link rel="stylesheet" href="/leaflet.css">
<style>html,body,#map{width:100%;height:100%;margin:0}body{font-family:system-ui,sans-serif}.stop-pin{display:flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;background:#fff;color:#172f43;border:2px solid #172f43;border-radius:18px;font-weight:700;box-shadow:0 1px 4px #555}.leaflet-popup-content{font-size:13px;line-height:1.4}.leaflet-popup-content p{margin:4px 0}.leaflet-popup-content button{min-height:42px;padding:8px;margin-right:6px;background:#fff;color:#172f43;border:1px solid #172f43;border-radius:5px}.map-fit{font-weight:700;padding:4px 8px;min-height:32px;background:#fff;color:#172f43;border:1px solid #777;border-radius:4px}#tile-error{position:absolute;bottom:22px;left:8px;z-index:1000;background:#fff;padding:6px 8px;border:1px solid #aaa;font-size:11px;max-width:65%;display:none}</style>
</head><body><div id="map" role="application" aria-label="Interactive route map"></div><div id="tile-error" role="status">Map tiles could not load. The stop list and navigation remain available.</div><script src="/leaflet.js"></script><script src="/route-map.js"></script></body></html>
