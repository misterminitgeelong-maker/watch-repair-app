name: Android weekly release

# Every Thursday afternoon (Melbourne time) build ONE Android bundle containing
# everything merged to main since the last release and upload it to the Play
# *internal testing* track. Auth to Google is keyless (Workload Identity Federation), no JSON key.
# Scheduled runs only ever use internal. A manual run can choose the production track, but only
# when someone selects it on purpose. Otherwise promote to production by hand in Play Console.
on:
  schedule:
    # GitHub cron is UTC: 05:00 UTC = 3pm AEST / 4pm AEDT.
    - cron: "0 5 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if no native Android code changed since the last release"
        type: boolean
        default: false
      track:
        description: "Play track to upload to. Scheduled runs always use internal. Production publishes to all users."
        type: choice
        options:
          - internal
          - production
        default: internal

concurrency: android-weekly-release

permissions:
  contents: write # tag + GitHub Release (the changelog record)
  id-token: write # GitHub OIDC token for keyless Google auth (Workload Identity Federation)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Work out what changed since the last release
        id: changes
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last_tag=$(git tag --list 'android-v*' --sort=-creatordate | head -n1)
          range=${last_tag:+$last_tag..HEAD}
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          # Native Android replaces the Capacitor package; future releases must keep building this app.
          count=$(git rev-list --count ${range:-HEAD} -- apps/mainspring-native-android)
          echo "native_commits=$count" >> "$GITHUB_OUTPUT"
          git log --no-merges --pretty='- %s (%h)' ${range:-HEAD} > "$RUNNER_TEMP/notes.md"
          if [ "$count" = "0" ] && [ "$FORCE" != "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No native Android changes since ${last_tag:-the beginning}; skipping."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.changes.outputs.release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Android SDK
        if: steps.changes.outputs.release == 'true'
        uses: android-actions/setup-android@v3
        with:
          # Match CI; avoid the action's default retired `tools` package.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Validate native app
        if: steps.changes.outputs.release == 'true'
        working-directory: apps/mainspring-native-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Restore signing key and Firebase config
        if: steps.changes.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Android signing secrets must be configured."; exit 1; }
          test -n "$GOOGLE_SERVICES_B64" || { echo "Native Play releases require Firebase config."; exit 1; }
          dir="$HOME/.mainspring-signing"
          mkdir -p "$dir"
          echo "$KEYSTORE_B64" | base64 -d > "$dir/upload.keystore"
          cat > "$dir/keystore.properties" <<PROPS
          storeFile=$dir/upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          sed -i 's/^ *//' "$dir/keystore.properties"
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > apps/mainspring-native-android/app/google-services.json
          fi

      - name: Build signed bundle
        if: steps.changes.outputs.release == 'true'
        id: build
        working-directory: apps/mainspring-native-android
        env:
          # Android-restricted Maps SDK key; when empty the route screen falls back to the OpenStreetMap view.
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          code=$(( $(date +%s) / 60 ))
          # Version codes here are minutes since 1970, so each build is higher than the last.
          # Production 1.1.0 is 29905801 (12 Nov 2026); never ship a code at or below it.
          min_code=29905801
          if [ "$code" -le "$min_code" ]; then echo "::error::Version code $code is not above the production code $min_code; check the runner clock."; exit 1; fi
          name="$(date -u +%Y.%m.%d)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode="$code" -PversionName="$name" -PplayRelease=true

      - name: Write Play "what's new"
        if: steps.changes.outputs.release == 'true'
        run: |
          mkdir -p whatsnew
          cat > whatsnew/whatsnew-en-AU <<'NOTES'
          Native Android update for shop and mobile workflows.
          - State hubs, direct messages, announcements and unread badges
          - Medal engraving events, live queue, tickets and laser exports
          - Birkenstock purchase/warranty details and shop parts stock
          - Mobile filters, reports, booking coverage and My Shops
          - Watch notes, templates, condition checklist and complete tickets
          - Two-option quotes and consistent payment methods
          - Reliability and update checks
          NOTES
          sed -i 's/^ *//' whatsnew/whatsnew-en-AU
          test "$(wc -c < whatsnew/whatsnew-en-AU)" -le 500

      - name: Keep the signed bundle as a workflow artifact
        if: steps.changes.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainspring-android-bundle
          path: apps/mainspring-native-android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Authenticate to Google (keyless)
        if: steps.changes.outputs.release == 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/807925254673/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-play-release@mainspring-play-release.iam.gserviceaccount.com

      - name: Upload to Play
        if: steps.changes.outputs.release == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          packageName: au.mainspring.app
          releaseFiles: apps/mainspring-native-android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: whatsnew

      - name: Tag release and record the changelog
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.build.outputs.name }}
          CODE: ${{ steps.build.outputs.code }}
        run: |
          tag="android-v$NAME"
          # A second release on the same day gets the version code appended so the tag never collides.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then tag="$tag-$CODE"; fi
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "Android $NAME ($CODE)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            apps/mainspring-native-android/app/build/outputs/bundle/release/app-release.aab
