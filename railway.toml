[build]
builder = "dockerfile"
# Pass git SHA into the frontend Vite build (see Dockerfile frontend-build stage).
buildArgs = { RAILWAY_GIT_COMMIT_SHA = "${{RAILWAY_GIT_COMMIT_SHA}}" }

[deploy]
healthcheckPath = "/v1/ready"
healthcheckTimeout = 300
# Keep the old process available while the new process passes DB readiness.
overlapSeconds = 60
drainingSeconds = 120
# Run schema migrations once per deploy, in a separate container from the same
# image, before the new deployment starts. A non-zero exit aborts the deploy.
# (Moved out of the Dockerfile CMD so rolling restarts don't race the DDL.)
# Seed the previous production entry too, protecting tabs opened before retention
# was enabled. Its manifest makes subsequent deployments skip this archive.
preDeployCommand = ["sh -c 'alembic upgrade head && python -m app.frontend_assets --bootstrap-live --bootstrap-entry index-DeZW3VUH.js'"]
